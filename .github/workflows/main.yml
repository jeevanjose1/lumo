name: Lumo

on: 
  push:
      branches: ['home']
  pull_request:
      branches: ['home']

jobs:
  build-lumo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
      
      - name: Install Deps
        run:  npm i
      
      - name: Build Project
        run: npm run build
  
  docker-luno:
    needs: build-lumo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
          
      - name: Set up Docker Buildx       
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKER_USER }}lumo:0.1

     